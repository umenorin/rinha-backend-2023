version: '3.5'
services:
  api1: # API - Instância 01
    build: ./cmd/client
    image: api
    hostname: api1
    depends_on:
      - db
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: '0.4GB'

  api2: # API - Instância 01
    build: ./cmd/client
    image: api
    hostname: api2
    depends_on:
      - db
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: '0.4GB'

  nginx: # Load Balancer
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '0.5GB'

  db: # Banco de dados
   image: postgres:17-alpine
   volumes: 
   - ./sql/Dockerfile
   deploy:
      resources:
        limits:
          cpus: '0.85'
          memory: '1.7GB'
